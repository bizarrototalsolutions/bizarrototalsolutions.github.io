<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zonas | BTS – Gestão</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="bts-app" data-page="zonas">

<div id="bts-sidebar"></div>

<div id="bts-main">
  <div id="bts-topbar"></div>

  <div id="bts-content">
    <div class="bts-page-header">
      <div>
        <h1>Zonas</h1>
        <p>Áreas de atuação da BTS — usadas em Clientes, Serviços e na Agenda.</p>
      </div>
      <button class="btn btn-bts-primary" id="btn-nova-zona">
        <i class="fa-solid fa-plus me-1"></i> Nova Zona
      </button>
    </div>

    <div class="bts-card mb-3">
      <div class="bts-card-body">
        <div class="bts-filters">
          <div class="bts-search" style="max-width:280px">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="busca-zonas" placeholder="Pesquisar zona..." />
          </div>
          <span class="ms-auto text-muted small" id="contador-zonas"></span>
        </div>
      </div>
    </div>

    <div class="bts-table-wrap" id="tabela-zonas-wrap">
      <table class="bts-table" id="tabela-zonas">
        <thead>
          <tr>
            <th>Zona</th>
            <th>Clientes</th>
            <th>Serviços</th>
            <th class="text-end">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-zonas"></tbody>
      </table>
    </div>

    <div class="bts-empty-state bts-card" id="zonas-empty" style="display:none">
      <i class="fa-solid fa-map-location-dot"></i>
      <p class="mb-3">Ainda não há zonas registadas.</p>
      <button class="btn btn-bts-primary" id="btn-nova-zona-empty"><i class="fa-solid fa-plus me-1"></i>Criar a primeira zona</button>
    </div>
  </div>
</div>

<!-- Modal criar/editar zona -->
<div class="modal fade" id="modal-zona" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="form-zona">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-zona-titulo">Nova Zona</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="zona-id" />
          <label class="bts-form-label">Nome da zona *</label>
          <input type="text" class="form-control" id="zona-nome" required placeholder="Ex: Sintra" />
          <div class="text-danger small mt-2" id="zona-erro" style="display:none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-bts-primary"><i class="fa-solid fa-floppy-disk me-1"></i>Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/zonas.js"></script>
</body>
</html>
