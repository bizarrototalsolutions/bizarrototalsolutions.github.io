<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | BTS – Gestão</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="bts-app" data-page="dashboard">

<div id="bts-sidebar"></div>

<div id="bts-main">
  <div id="bts-topbar"></div>

  <div id="bts-content">
    <div class="bts-page-header">
      <div>
        <h1 id="dash-saudacao">Olá!</h1>
        <p>Resumo geral da tua atividade na BTS.</p>
      </div>
      <a href="servico.html" class="btn btn-bts-primary">
        <i class="fa-solid fa-plus me-1"></i> Novo Serviço
      </a>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-blue"><i class="fa-solid fa-users"></i></div>
          <div>
            <div class="bts-stat-value" id="kpi-clientes">0</div>
            <div class="bts-stat-label">Clientes ativos</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-gold"><i class="fa-solid fa-calendar-day"></i></div>
          <div>
            <div class="bts-stat-value" id="kpi-hoje">0</div>
            <div class="bts-stat-label">Serviços hoje</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-warning"><i class="fa-solid fa-hourglass-half"></i></div>
          <div>
            <div class="bts-stat-value" id="kpi-pendentes">0</div>
            <div class="bts-stat-label">Serviços pendentes</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-success"><i class="fa-solid fa-circle-check"></i></div>
          <div>
            <div class="bts-stat-value" id="kpi-concluidos-mes">0</div>
            <div class="bts-stat-label">Concluídos este mês</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-7">
        <div class="bts-card mb-3">
          <div class="bts-card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="text-muted text-uppercase small fw-bold mb-0">Próximos Serviços</h6>
              <a href="agenda.html" class="small">Ver agenda <i class="fa-solid fa-arrow-right ms-1"></i></a>
            </div>
            <div id="dash-proximos"></div>
          </div>
        </div>

        <div class="bts-card">
          <div class="bts-card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="text-muted text-uppercase small fw-bold mb-0">Clientes Recentes</h6>
              <a href="clientes.html" class="small">Ver todos <i class="fa-solid fa-arrow-right ms-1"></i></a>
            </div>
            <div id="dash-clientes-recentes"></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-5">
        <div class="bts-card mb-3">
          <div class="bts-card-body">
            <h6 class="text-muted text-uppercase small fw-bold mb-3">Serviços por Estado</h6>
            <div id="dash-por-estado"></div>
          </div>
        </div>

        <div class="bts-card">
          <div class="bts-card-body">
            <h6 class="text-muted text-uppercase small fw-bold mb-3">Zonas com Mais Serviços</h6>
            <div id="dash-por-zona"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
