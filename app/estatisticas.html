<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Estatísticas | BTS – Gestão</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
  <link rel="manifest" href="../site.webmanifest" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="../css/variables.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/app.css" />
<style>
  .bts-chart-card canvas { max-height: 280px; }
</style>
</head>
<body class="bts-app" data-page="estatisticas">

<div id="bts-sidebar"></div>

<div id="bts-main">
  <div id="bts-topbar"></div>

  <div id="bts-content">
    <div class="bts-page-header">
      <div>
        <h1>Estatísticas</h1>
        <p>Indicadores de negócio a partir dos teus clientes e serviços.</p>
      </div>
      <select class="form-select form-select-sm" id="filtro-ano-estatisticas" style="max-width:130px"></select>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-navy"><i class="fa-solid fa-screwdriver-wrench"></i></div>
          <div><div class="bts-stat-value" id="est-total-servicos">0</div><div class="bts-stat-label">Serviços no ano</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-success"><i class="fa-solid fa-circle-check"></i></div>
          <div><div class="bts-stat-value" id="est-taxa-conclusao">0%</div><div class="bts-stat-label">Taxa de conclusão</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-blue"><i class="fa-solid fa-ruler-combined"></i></div>
          <div><div class="bts-stat-value" id="est-area-total">0</div><div class="bts-stat-label">m² trabalhados</div></div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="bts-card bts-stat-card">
          <div class="bts-stat-icon bts-icon-gold"><i class="fa-solid fa-users"></i></div>
          <div><div class="bts-stat-value" id="est-clientes-ativos">0</div><div class="bts-stat-label">Clientes ativos</div></div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-7">
        <div class="bts-card bts-chart-card mb-3">
          <div class="bts-card-body">
            <h6 class="text-muted text-uppercase small fw-bold mb-3">Serviços por mês</h6>
            <canvas id="chart-por-mes"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-5">
        <div class="bts-card bts-chart-card mb-3">
          <div class="bts-card-body">
            <h6 class="text-muted text-uppercase small fw-bold mb-3">Por estado</h6>
            <canvas id="chart-por-estado"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="bts-card bts-chart-card mb-3">
          <div class="bts-card-body">
            <h6 class="text-muted text-uppercase small fw-bold mb-3">Por categoria</h6>
            <canvas id="chart-por-categoria"></canvas>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="bts-card bts-chart-card mb-3">
          <div class="bts-card-body">
            <h6 class="text-muted text-uppercase small fw-bold mb-3">Clientes por zona</h6>
            <canvas id="chart-clientes-zona"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/estatisticas.js"></script>
</body>
</html>
